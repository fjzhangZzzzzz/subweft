// Pure, line-based LCS diff for this small, self-contained prototype.
// Redact before comparing: changing an address must remain visible without exposing it.
function configurationDiff(before,after){
  const left=Model.clone(before),right=Model.clone(after),sensitive=[];
  for(const [key,label] of [['sources','订阅'],['sets','远程规则集']]){
    for(const [items,other,isBefore] of [[left[key],after[key],true],[right[key],before[key],false]]){
      for(const item of items){
        if(!('url' in item))continue;
        const previous=other.find(x=>x.id===item.id),changed=previous&&previous.url!==item.url;
        if(changed&&!isBefore)sensitive.push(`${label}「${item.name}」地址已修改`);
        item.url=changed?`[地址已隐藏 · ${isBefore?'修改前':'修改后'}]`:'[地址已隐藏]';
      }
    }
  }
  const a=Model.yaml(left,false).split('\n'),b=Model.yaml(right,false).split('\n');
  const dp=Array.from({length:a.length+1},()=>new Uint32Array(b.length+1));
  for(let i=a.length-1;i>=0;i--)for(let j=b.length-1;j>=0;j--)dp[i][j]=a[i]===b[j]?1+dp[i+1][j+1]:Math.max(dp[i+1][j],dp[i][j+1]);
  const lines=[];let i=0,j=0;
  while(i<a.length||j<b.length){
    if(i<a.length&&j<b.length&&a[i]===b[j]){lines.push({kind:'same',text:a[i],old:++i,new:++j});}
    else if(i<a.length&&(j===b.length||dp[i+1][j]>=dp[i][j+1])){lines.push({kind:'del',text:a[i],old:++i});}
    else{lines.push({kind:'add',text:b[j],new:++j});}
  }
  return {lines,sensitive,added:lines.filter(x=>x.kind==='add').length,removed:lines.filter(x=>x.kind==='del').length};
}

function changedText(text,other){
  if(other===undefined)return esc(text);
  let start=0,end=0;
  while(start<Math.min(text.length,other.length)&&text[start]===other[start])start++;
  while(end<Math.min(text.length,other.length)-start&&text[text.length-1-end]===other[other.length-1-end])end++;
  return esc(text.slice(0,start))+(start<text.length-end?`<mark>${esc(text.slice(start,text.length-end))}</mark>`:'')+(end?esc(text.slice(-end)):'');
}

        if(expanded)body+=run.slice(head,run.length-tail).map(same).join('');

      else body+=removed.map((line,n)=>`<div class="diff-row">${cell(line,added[n],true)}</div>`).join('')+added.map((line,n)=>`<div class="diff-row">${cell(line,removed[n],true)}</div>`).join('');

  }
  if(a==='revoke-device'){
    const d=state.devices.find(x=>x.id===id);if(await ask(`撤销“${d.name}”的授权？`,'此操作立即阻止后续下载，无法恢复此链接。已经下载的配置不会被收回。','撤销授权',true)){d.state='revoked';render();toast('设备授权已撤销，草稿和发布版本未变。');}return;
  }
  if(a==='rotate-device'){
    const d=state.devices.find(x=>x.id===id);if(await ask(`更换“${d.name}”的链接？`,'旧链接立即失效，需要在客户端重新导入新链接。','更换链接')){d.generation++;render();openForm('link',d,{readonly:true});toast('链接已更换，旧链接立即失效。');}return;
  }
}
document.addEventListener('click',event=>{
  const el=event.target.closest('[data-action]');if(!el||el.disabled)return;
  event.preventDefault();handleAction(el).catch(error=>{console.error(error);toast('原型操作遇到错误，请重试或重置样例。');});
});
document.addEventListener('submit',event=>{if(event.target.matches('#drawer form')){event.preventDefault();saveForm();}});
document.addEventListener('input',event=>{
  const el=event.target;
  if(el.matches('[data-search]')){const pos=el.selectionStart;query=el.value;render();const search=$('[data-search]');search.focus();search.setSelectionRange(pos,pos);return;}
  if(el.id==='publish-note'){state.note=el.value;return;}
  if(el.closest('#drawer form')&&form){
    if(form.type==='bulk'){form.bulkPreview=null;$('#bulk-preview').innerHTML='';$('#drawer button[type=submit]').disabled=true;}
    el.removeAttribute('aria-invalid');const error=$(`#err-${el.name}`);if(error)error.textContent='';$('#form-error').innerHTML='';updateFormPreview();
  }
});
document.addEventListener('change',event=>{
  const el=event.target;
  if(el.dataset.filter){if(el.dataset.filter==='pool')poolFilter=el.value;else sourceStatus=el.value;render();return;}
  if(!form||!el.closest('#drawer form'))return;
  if((form.type==='group'&&el.name==='mode')||(form.type==='set'&&el.name==='kind')||(['entry','rule'].includes(form.type)&&el.name==='type')||(form.type==='rule'&&el.name==='target')){
    const values=readForm();form.value={...form.value,...values};
    if(form.type==='rule'&&el.name==='type')form.value.value='';
    renderDrawer();$(`#f-${el.name}`)?.focus();
  }else updateFormPreview();
});
$('#drawer').addEventListener('cancel',event=>{event.preventDefault();closeDrawer();});
$('#confirm-dialog').addEventListener('cancel',event=>{event.preventDefault();const resolve=confirmResolve;confirmResolve=null;$('#confirm-dialog').close();resolve?.(false);});
$('#drawer').addEventListener('click',event=>{if(event.target===$('#drawer')){const r=$('#drawer').getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeDrawer();}});
let draggedRule=null;
document.addEventListener('dragstart',event=>{const handle=event.target.closest('[data-drag]');if(!handle||query)return;draggedRule=handle.dataset.drag;event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/plain',draggedRule);});
document.addEventListener('dragover',event=>{if(draggedRule&&event.target.closest('[data-drop]'))event.preventDefault();});
document.addEventListener('drop',event=>{
  const row=event.target.closest('[data-drop]');if(!draggedRule||!row||query)return;event.preventDefault();
  const c=clone(state.draft),from=c.rules.findIndex(r=>r.id===draggedRule),to=c.rules.findIndex(r=>r.id===row.dataset.drop);draggedRule=null;
  if(from===to||from<0||to<0)return;const [r]=c.rules.splice(from,1);c.rules.splice(to,0,r);commit(c);
});
document.addEventListener('dragend',()=>{draggedRule=null;});
// START
matchMedia('(max-width:760px)').addEventListener('change',()=>{if(page==='review'&&reviewTab==='config')render();});
render();
</script>
</body>
</html>
